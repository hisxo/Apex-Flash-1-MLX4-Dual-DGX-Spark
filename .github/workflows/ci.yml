name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: >-
          bash -n deploy/start-rank.sh deploy/stop-rank.sh
          benchmarks/harness/run-delulu.sh benchmarks/harness/run-network-tools.sh
      - run: >-
          python -m py_compile benchmarks/harness/install_boxpwnr_adapter.py
          benchmarks/harness/stream_concurrency.py
      - run: python -m unittest discover -s tests -v
